name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check whether the review workflow matches the default branch
        id: review-config
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Claude's OIDC exchange only accepts the workflow on the default branch.
          # Make that expected skip explicit before trying to run a review.
          git fetch --no-tags --depth=1 origin "$DEFAULT_BRANCH"
          git show FETCH_HEAD:.github/workflows/claude-code-review.yml > "$RUNNER_TEMP/default-claude-review.yml"
          if cmp -s .github/workflows/claude-code-review.yml "$RUNNER_TEMP/default-claude-review.yml"; then
            echo 'matches_default=true' >> "$GITHUB_OUTPUT"
          else
            echo 'matches_default=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Claude review skipped: this PR changes the review workflow. A new review run is required after merge.'
            echo '### Claude review skipped' >> "$GITHUB_STEP_SUMMARY"
            echo 'This PR changes the review workflow. Claude requires it to match the default branch before running. No review was performed; run a new review after merging the workflow.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run Claude Code Review
        id: claude-review
        if: steps.review-config.outputs.matches_default == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          # The action exits on the first SDK result, even with agents pending.
          # Keep plugin subagents synchronous until anthropics/claude-code-action#1499 is fixed.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Explicitly approve the plugin's GitHub CLI tools for its subagents too.
          claude_args: >-
            --allowedTools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),mcp__github_inline_comment__create_inline_comment"
          display_report: true
          show_full_output: ${{ runner.debug == '1' }}

      - name: Verify Claude review completed without pending tasks or permission denials
        if: ${{ !cancelled() && steps.review-config.outputs.matches_default == 'true' }}
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          if [[ ! -s "$EXECUTION_FILE" ]]; then
            echo '::error::Claude did not produce an execution result. Check the action logs for a failure or workflow validation skip.'
            exit 1
          fi

          # A successful parent turn can merely mean "waiting for a subagent".
          # Fail if the last task snapshot still contains unfinished work.
          if ! jq -e '
            [.[] | select(.type == "system" and .subtype == "background_tasks_changed")] |
            last | (.tasks // []) | length == 0
          ' "$EXECUTION_FILE" > /dev/null; then
            echo '::error::Claude ended with background tasks still pending. The review did not finish. See the Claude report in the job summary.'
            exit 1
          fi

          # The action can report success even when a required tool was denied.
          # Inspect the final SDK result without printing prompts or tool inputs.
          if ! jq -e '
            [.[] | select(.type == "result")] | last |
            .subtype == "success" and .is_error == false and
            (.permission_denials | type == "array" and length == 0)
          ' "$EXECUTION_FILE" > /dev/null; then
            echo '::error::Claude review failed, returned no final result, or encountered a tool permission denial. See the Claude report in the job summary.'
            jq -r '
              [.[] | select(.type == "result")] | last |
              (.permission_denials // [])[] | .tool_name |
              "Denied tool: \(. | @json)"
            ' "$EXECUTION_FILE"
            exit 1
          fi
