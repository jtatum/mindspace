name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Explicitly approve the plugin's GitHub CLI tools for its subagents too.
          claude_args: >-
            --allowedTools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),mcp__github_inline_comment__create_inline_comment"
          display_report: true

      - name: Verify Claude review completed without permission denials
        if: ${{ !cancelled() }}
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          if [[ ! -s "$EXECUTION_FILE" ]]; then
            echo '::error::Claude did not produce an execution result. Check the action logs for a failure or workflow validation skip.'
            exit 1
          fi

          # The action can report success even when a required tool was denied.
          # Inspect the final SDK result without printing prompts or tool inputs.
          if ! jq -e '
            [.[] | select(.type == "result")] | last |
            .subtype == "success" and .is_error == false and
            (.permission_denials | type == "array" and length == 0)
          ' "$EXECUTION_FILE" > /dev/null; then
            echo '::error::Claude review failed, returned no final result, or encountered a tool permission denial. See the Claude report in the job summary.'
            jq -r '
              [.[] | select(.type == "result")] | last |
              (.permission_denials // [])[] | .tool_name |
              "Denied tool: \(. | @json)"
            ' "$EXECUTION_FILE"
            exit 1
          fi
