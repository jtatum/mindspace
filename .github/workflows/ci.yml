name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The local protocol test launches Codex against a loopback mock server.
      # Keep this version aligned with CODEX_VERSION in src/server/runtime/rpc.ts.
      - name: Install Codex CLI
        run: npm install --global @openai/codex@0.154.0

      - name: Run unit tests
        run: npm test
